    <!--
      Google Tag Manager, charge une fois le fil principal libre.

      Le fragment officiel injecte gtm.js depuis la premiere ligne du <head>.
      Le script porte bien `async`, donc il ne bloque pas l'analyse du
      document, mais il se telecharge et s'execute pendant que React demarre :
      192 des 312 ko de JavaScript de l'accueil, sur le meme fil, au moment
      exact ou le visiteur attend de voir la page.

      On garde `dataLayer` disponible tout de suite, pour que rien de ce qui
      est pousse avant le chargement ne soit perdu, et on ne va chercher gtm.js
      qu'apres l'evenement `load`, dans un moment d'inactivite. Une premiere
      interaction le charge immediatement, sans attendre.

      Ce que ca coute : un visiteur qui repart en moins d'une seconde peut ne
      pas etre compte. Ce que ca rapporte : ce sont les memes centaines de
      millisecondes que le visiteur passait devant une page pas encore affichee.
    -->
    <script>
      (function (w, d, id) {
        w.dataLayer = w.dataLayer || [];
        var fait = false;
        var charger = function () {
          if (fait) return;
          fait = true;
          w.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var j = d.createElement('script');
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=' + id;
          d.head.appendChild(j);
        };
        var programmer = function () {
          if (w.requestIdleCallback) w.requestIdleCallback(charger, { timeout: 3000 });
          else w.setTimeout(charger, 1200);
        };
        if (d.readyState === 'complete') programmer();
        else w.addEventListener('load', programmer, { once: true });
        // Filet : quelqu'un qui agit avant la fin du chargement est mesure tout de suite.
        ['pointerdown', 'keydown', 'touchstart'].forEach(function (e) {
          w.addEventListener(e, charger, { once: true, passive: true });
        });
      })(window, document, 'GTM-MTQ3GP5H');
    </script>

    <!-- Stale-chunk guard: if a JS bundle fails to load (old cached HTML after a deploy),
         reload once so the browser fetches fresh HTML with correct chunk URLs.
         Uses localStorage with 60s cooldown to prevent infinite loops. -->
    <script>
      (function() {
        var key = 'scr';
        window.addEventListener('error', function(e) {
          if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
            var ts = localStorage.getItem(key);
            if (!ts || Date.now() - Number(ts) > 60000) {
              localStorage.setItem(key, String(Date.now()));
              window.location.reload();
            }
          }
        }, true);
      })();
    </script>
